<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120c1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Albert">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Le Quiz d'Albert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Figtree:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Concept : une crypte la nuit d'Halloween. Landing avec lune orange et zombie aux lèvres cousues, question gravée sur une pierre tombale, retour à la crypte après chaque réponse. Un seul univers sombre, volontairement. */
:root {
  color-scheme: dark;
  --bg: #120c1a;
  --surface: #251935;
  --surface-hi: #33234c;
  --fg: #f6efe6;
  --muted: #b9abc9;
  --line: #4a3963;
  --orange: #ff7a1a;
  --orange-ink: #1c0e00;
  --purple: #9b5cff;
  --slime: #a6f26b;
  --slime-ink: #0d2000;
  --bad: #ff6b7a;
  --stone: #d9d2e6;
  --stone-ink: #1d1428;
  --night: #0a0610;
  --z-skin: #a9c98d;
  --z-skin-sh: #7f9f68;
  --z-hair: #f6f3f8;
  --z-hair-sh: #cdc7da;
  --z-shirt: #3345d6;
  --z-shirt-lt: #5566ee;
  --z-ink: #2a1a2e;
  --z-lip: #9a6a86;
  --font-display: "Creepster", "Chalkduster", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body {
  min-height: 100%;
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(120% 55% at 50% -8%, #43206b 0%, rgba(67, 32, 107, 0) 62%);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
mark {
  background: var(--orange);
  color: var(--orange-ink);
  padding: 0 .16em;
  border-radius: 6px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

.app {
  max-width: 480px;
  min-height: calc(100vh - 42px);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* En-tête */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-size: 1.45rem; letter-spacing: .02em; }
.brand span { margin-left: .3em; color: var(--muted); }
.score {
  font-family: var(--font-mono);
  font-size: .78rem;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 12px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.score b { color: var(--fg); font-weight: 500; }

.screen { display: flex; flex-direction: column; gap: 18px; flex: 1; min-width: 0; }

/* Landing */
.stage {
  position: relative;
  width: 100%;
  max-width: 360px;
  aspect-ratio: 1 / 1.04;
  margin: 0 auto;
  overflow: hidden;
  border-radius: 28px;
  background: linear-gradient(180deg, #1c1030 0%, #2a1346 100%);
}
.moon {
  position: absolute;
  left: 50%;
  top: 5%;
  width: 70%;
  aspect-ratio: 1;
  transform: translateX(-50%);
  border-radius: 50%;
  background:
    radial-gradient(circle at 62% 58%, rgba(120, 50, 0, .22) 0 9%, transparent 10%),
    radial-gradient(circle at 34% 66%, rgba(120, 50, 0, .18) 0 6%, transparent 7%),
    radial-gradient(circle at 40% 30%, rgba(120, 50, 0, .16) 0 5%, transparent 6%),
    radial-gradient(circle at 35% 35%, #ffe8b4, #ffb35a 62%, #ff7a1a 100%);
  box-shadow: 0 0 70px 18px rgba(255, 122, 26, .38);
}
.bat { position: absolute; width: 11%; color: var(--night); }
.bat svg { display: block; width: 100%; height: auto; fill: currentColor; }
.bat.b1 { left: 8%; top: 12%; }
.bat.b2 { right: 9%; top: 24%; width: 14%; }
.bat.b3 { left: 70%; top: 5%; width: 8%; }
.fig { position: absolute; left: 50%; bottom: 0; width: 74%; transform: translateX(-50%); }
.fig svg { display: block; width: 100%; height: auto; }
.graves { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 22%; display: block; fill: var(--night); stroke: var(--night); }
.title {
  margin: 4px 0 0;
  text-align: center;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 3.1rem;
  line-height: 1;
  letter-spacing: .02em;
  text-wrap: balance;
}
.title:focus { outline: none; }
.lead { margin: 0; text-align: center; color: var(--muted); font-size: 1rem; text-wrap: balance; }
.cta {
  width: 100%;
  min-height: 70px;
  border: 0;
  border-radius: 18px;
  background: var(--orange);
  color: var(--orange-ink);
  font-family: var(--font-display);
  font-size: 1.75rem;
  letter-spacing: .03em;
  cursor: pointer;
  box-shadow: 0 0 0 0 rgba(255, 122, 26, .5), 0 10px 30px -8px rgba(255, 122, 26, .55);
  transition: transform .12s ease;
}
.cta:active { transform: scale(.98); }
.count {
  margin: 0;
  text-align: center;
  font-family: var(--font-mono);
  font-size: .75rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Zombie */
.zombie .z-skin { fill: var(--z-skin); }
.zombie .z-skin-sh { fill: var(--z-skin-sh); }
.zombie .z-hair { fill: var(--z-hair); stroke: var(--z-hair-sh); stroke-width: 2; }
.zombie .z-shirt { fill: var(--z-shirt); }
.zombie .z-collar { fill: var(--z-shirt-lt); }
.zombie .z-patch { fill: #6b36b0; stroke: #d9c4ff; stroke-width: 2; stroke-dasharray: 5 4; }
.zombie .z-lip { fill: var(--z-lip); }
.zombie .z-line { fill: none; stroke: var(--z-ink); stroke-linecap: round; stroke-linejoin: round; }
.zombie .z-lens { fill: rgba(255, 255, 255, .13); stroke: var(--z-ink); stroke-width: 3; }
.zombie .z-white { fill: #eef3c9; }
.zombie .z-pupil { fill: var(--z-ink); }
.zombie .e-happy, .zombie .e-dead { display: none; }
.zombie[data-mood="happy"] .e-idle, .zombie[data-mood="dead"] .e-idle { display: none; }
.zombie[data-mood="happy"] .e-happy, .zombie[data-mood="dead"] .e-dead { display: inline; }

/* Question */
.hint { margin: 0; text-align: center; color: var(--muted); font-size: .95rem; }
.tomb {
  background: linear-gradient(180deg, #e3dcf0 0%, #c9c0da 100%);
  color: var(--stone-ink);
  border-radius: 50% 50% 18px 18px / 120px 120px 18px 18px;
  padding: 58px 22px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
  box-shadow: inset 0 0 0 3px rgba(29, 20, 40, .12), 0 12px 30px -10px rgba(0, 0, 0, .6);
}
.tag {
  font-family: var(--font-mono);
  font-size: .72rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  border: 1.5px solid currentColor;
  border-radius: 999px;
  padding: 4px 11px;
}
.qtext {
  margin: 0;
  font-weight: 800;
  font-size: 1.4rem;
  line-height: 1.22;
  letter-spacing: -.01em;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.qtext:focus { outline: none; }
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 66px;
  padding: 12px 16px 12px 12px;
  text-align: left;
  font-weight: 700;
  font-size: 1.02rem;
  line-height: 1.3;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  cursor: pointer;
  transition: transform .12s ease, border-color .12s ease, background-color .12s ease;
}
.opt .ltr {
  flex: none;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--orange);
  color: var(--orange-ink);
  font-family: var(--font-mono);
  font-size: .95rem;
}
.opt .txt { min-width: 0; overflow-wrap: anywhere; }
.opt:active { transform: scale(.98); background: var(--surface-hi); border-color: var(--orange); }
@media (hover: hover) { .opt:hover { border-color: var(--orange); background: var(--surface-hi); } }

/* Résultat */
.res-fig { width: 150px; margin: 0 auto; }
.res-fig svg { display: block; width: 100%; height: auto; }
.headline {
  margin: 0;
  text-align: center;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 2.5rem;
  line-height: 1.05;
  letter-spacing: .02em;
  text-wrap: balance;
}
.headline.ok { color: var(--slime); text-shadow: 0 0 22px rgba(166, 242, 107, .45); }
.headline.ko { color: var(--bad); text-shadow: 0 0 22px rgba(255, 107, 122, .4); }
.headline:focus { outline: none; }
.snitch { margin: 0; text-align: center; font-family: var(--font-mono); font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; color: var(--bad); }
.recap { margin: 0; text-align: center; color: var(--muted); font-size: .95rem; overflow-wrap: anywhere; }
.answers { display: flex; flex-direction: column; gap: 10px; }
.ans { border-radius: 14px; padding: 12px 14px; border: 1.5px solid var(--line); background: var(--surface); min-width: 0; }
.ans.right { border-color: var(--slime); }
.ans.wrong { border-color: var(--bad); }
.ans small {
  display: block;
  font-family: var(--font-mono);
  font-size: .7rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 2px;
}
.ans p { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.why { background: var(--surface); border-radius: 18px; padding: 16px 18px; min-width: 0; }
.why h3 {
  margin: 0 0 6px;
  font-family: var(--font-mono);
  font-size: .72rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--orange);
}
.why p { margin: 0; overflow-wrap: anywhere; }
.back { margin-top: auto; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

@media (prefers-reduced-motion: no-preference) {
  .screen:not([hidden]) { animation: rise .3s ease both; }
  .fig { animation: bob 4.2s ease-in-out infinite; }
  .bat { animation: flap 3.4s ease-in-out infinite; }
  .bat.b2 { animation-duration: 4.1s; animation-delay: -1s; }
  .bat.b3 { animation-duration: 2.8s; animation-delay: -2s; }
  .zombie .e-idle { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  .res-fig { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both; }
}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes bob { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-7px); } }
@keyframes flap { 0%, 100% { transform: translate(0, 0) rotate(-5deg); } 50% { transform: translate(9px, -7px) rotate(5deg); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .opt, .cta { transition: none; } }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><mark>Albert</mark><span>Cyber Quiz</span></div>
    <div class="score" id="score" aria-live="polite">Score <b>0/0</b></div>
  </header>

  <section class="screen" id="screenL" aria-labelledby="h1">
    <div class="stage">
      <div class="moon" aria-hidden="true"></div>
      <div class="bat b1" aria-hidden="true"><svg viewBox="0 0 40 20"><path d="M0 8 C8 0 14 5 20 12 C26 5 32 0 40 8 C34 7 30 11 28 18 C24 13 16 13 12 18 C10 11 6 7 0 8Z"/></svg></div>
      <div class="bat b2" aria-hidden="true"><svg viewBox="0 0 40 20"><path d="M0 8 C8 0 14 5 20 12 C26 5 32 0 40 8 C34 7 30 11 28 18 C24 13 16 13 12 18 C10 11 6 7 0 8Z"/></svg></div>
      <div class="bat b3" aria-hidden="true"><svg viewBox="0 0 40 20"><path d="M0 8 C8 0 14 5 20 12 C26 5 32 0 40 8 C34 7 30 11 28 18 C24 13 16 13 12 18 C10 11 6 7 0 8Z"/></svg></div>
      <div class="fig" id="figL"></div>
      <svg class="graves" viewBox="0 0 340 80" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 68 H340 V80 H0Z"/>

        <path d="M292 80 V34 Q292 14 314 14 Q336 14 336 34 V80Z"/>
        <path d="M66 80 V50 M55 58 H77" fill="none" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="title" id="h1" tabindex="-1">Le quiz d'<mark>Albert</mark></h1>
    <p class="lead">Même après la mort, Albert revient te hanter pour que tu fasses ta formation cybersécurité. Une question au hasard, trois réponses.</p>
    <button class="cta" id="draw" type="button">Réveiller une question</button>
    <p class="count" id="count"></p>
  </section>

  <section class="screen" id="screenQ" hidden aria-labelledby="qtext">
    <p class="hint">Choisis bien. Albert ne dira rien.</p>
    <div class="tomb">
      <span class="tag" id="qtag"></span>
      <h2 class="qtext" id="qtext" tabindex="-1"></h2>
    </div>
    <div class="opts" id="opts" role="group" aria-label="Réponses possibles"></div>
  </section>

  <section class="screen" id="screenR" hidden aria-live="polite"></section>
</div>

<canvas id="confetti" hidden aria-hidden="true"></canvas>

<template id="zombieTpl">
  <svg class="zombie" viewBox="0 0 320 340" role="img" aria-label="Albert, zombie à lunettes rondes, cheveux blancs bouclés et moustache, les lèvres cousues" data-mood="idle">
    <path class="z-shirt" d="M30 340 C30 288 84 262 160 262 C236 262 290 288 290 340 Z"/>

<script>
(function () {
  var Q = [
    { tag: "Clé USB", q: "Si je trouve une clé USB sur le parking, je…",
      o: ["la remets à l'équipe cybersécurité", "la branche sur mon PC pour voir à qui elle est", "la brûle dans le jardin"],
      why: "Une clé inconnue peut cacher un virus qui s'installe dès qu'on la branche. L'équipe cybersécurité sait l'analyser sans risque. La brûler ne sert à rien et dégage de vilaines fumées." },
    { tag: "Mots de passe", q: "Pour mon nouveau mot de passe, je choisis…",
      o: ["une phrase longue que je suis le seul à connaître", "Azerty123, c'est facile à retenir", "le prénom de mon chat suivi de 1234"],
      why: "Plus un mot de passe est long, plus il est difficile à deviner. Les mots de passe très connus sont les premiers testés par les pirates." },
    { tag: "Phishing", q: "Je reçois un mail : « Vous avez gagné un iPhone, cliquez vite ! ». Je…",
      o: ["le signale comme suspect, puis je le supprime", "clique, on ne sait jamais", "le transfère à toute l'équipe pour partager la chance"],
      why: "Un cadeau surprise qui presse est le grand classique de l'hameçonnage. Signaler le mail aide l'équipe sécurité à protéger tout le monde." },
    { tag: "Authentification", q: "La double authentification, c'est…",
      o: ["prouver qui je suis avec deux éléments différents, par exemple un mot de passe et un code", "avoir deux mots de passe identiques pour être sûr", "créer deux comptes au cas où"],
      why: "Même si quelqu'un vole ton mot de passe, il lui manque le deuxième élément, par exemple le code envoyé sur ton téléphone." },
    { tag: "Poste de travail", q: "Je pars déjeuner et mon ordinateur reste sur mon bureau. Je…",
      o: ["verrouille ma session avant de partir", "le laisse ouvert, je reviens dans 20 minutes", "colle un post-it « Ne pas toucher »"],
      why: "Verrouiller prend une seconde (touches Windows + L sur PC, Ctrl + Cmd + Q sur Mac). Un post-it n'arrête personne." },
    { tag: "Vishing", q: "On m'appelle : « Support informatique, donnez-moi votre mot de passe ». Je…",
      o: ["raccroche et je préviens l'équipe sécurité", "le donne, il a l'air très pressé", "ne donne que la moitié du mot de passe"],
      why: "Un vrai support ne demande jamais ton mot de passe. Même la moitié, c'est déjà trop." },
    { tag: "Wi-Fi public", q: "Je suis dans un café et je dois consulter des documents de l'entreprise. Je…",
      o: ["utilise le partage de connexion de mon téléphone ou le VPN", "me connecte au réseau « Wi-Fi_Gratuit_Vraiment_Sûr »", "crie « JAD, AU SECOURS »"],
      why: "Un Wi-Fi public peut être espionné, ou copié par un pirate qui lui donne un nom sympathique. Ta connexion mobile ou le VPN de l'entreprise est bien plus sûre." },
    { tag: "Mises à jour", q: "Mon ordinateur me propose une mise à jour pour la 47e fois. Je…",
      o: ["l'installe dès que possible", "clique sur « Plus tard » une 48e fois", "crie « JAD, AU SECOURS »"],
      why: "Les mises à jour corrigent des failles connues. Les repousser laisse la porte ouverte aux attaques." },
    { tag: "Pièce jointe", q: "Un mail contient une pièce jointe nommée « facture.pdf.exe ». Je…",
      o: ["ne l'ouvre pas et je signale le mail", "l'ouvre, c'est une facture après tout", "crie « JAD, AU SECOURS »"],
      why: "Un fichier .exe est un programme, pas un PDF. Le renommer ne change rien à ce qu'il fait une fois ouvert." },
    { tag: "Fraude au PDG", q: "Mon patron m'écrit : « Urgent, achète 10 cartes cadeaux et envoie-moi les codes ». Je…",
      o: ["vérifie auprès de lui par un autre moyen, comme un appel", "les achète sans poser de question", "crie « JAD, AU SECOURS »"],
      why: "C'est une arnaque très répandue. Une demande urgente et inhabituelle se vérifie toujours par un autre canal que celui du message." },
    { tag: "Code SMS", q: "Je reçois un code de connexion par SMS alors que je n'ai rien demandé. Je…",
      o: ["ne le donne à personne et je change mon mot de passe", "le donne à la personne qui me rappelle juste après", "le poste en story pour avoir des avis"],
      why: "Ce code signifie que quelqu'un essaie d'entrer dans ton compte. Il ne se partage jamais, même avec une voix aimable au téléphone." },
    { tag: "Réseaux sociaux", q: "Je viens de recevoir mon badge d'entreprise tout neuf. Je…",
      o: ["le garde pour moi", "le prends en photo et je le poste, il est trop beau", "crie « JAD, AU SECOURS »"],
      why: "Une photo de badge permet de le reproduire. Le filtre sépia n'y change rien." },
    { tag: "Navigateur", q: "Un site affiche un cadenas dans la barre d'adresse. Ça veut dire que…",
      o: ["ma connexion est chiffrée, mais le site peut quand même être faux", "le site est forcément honnête", "le site est protégé par un vrai cadenas, en métal"],
      why: "Le cadenas protège le trajet des données. Il ne dit rien sur les intentions du site : un site frauduleux peut aussi en avoir un." },
    { tag: "Documents", q: "J'ai un document confidentiel à jeter. Je…",
      o: ["le passe au broyeur", "le mets dans la corbeille à papier", "en fais un avion pour l'envoyer par la fenêtre"],
      why: "Les poubelles se fouillent. Un broyeur rend le document illisible pour de bon." },
    { tag: "Applications", q: "Une appli de lampe torche demande l'accès à mes contacts, à mon micro et à mes SMS. Je…",
      o: ["refuse, une lampe n'a pas besoin de tout ça", "accepte, elle doit être très complète", "accepte, mais seulement le mardi"],
      why: "Une appli ne doit demander que les accès utiles à sa fonction. Une lampe qui veut lire tes SMS cherche autre chose que de la lumière." },
    { tag: "Sauvegardes", q: "Pour mes fichiers importants, je…",
      o: ["fais des sauvegardes régulières dans un autre endroit", "les garde en un seul exemplaire, ça va bien se passer", "les enregistre trois fois dans le même dossier"],
      why: "Si le disque plante ou si un virus chiffre tes fichiers, une copie ailleurs te sauve. Trois copies au même endroit comptent pour une." },
    { tag: "Smishing", q: "Je reçois un SMS : « Votre colis est bloqué, payez 1,99 € de frais ». Je…",
      o: ["ignore le lien et je vérifie sur le site officiel du transporteur", "paie, c'est juste 1,99 €", "réponds au SMS pour discuter avec l'expéditeur"],
      why: "Les petits montants servent surtout à récupérer les données de ta carte bancaire. Passe toujours par le site ou l'appli officielle." },
    { tag: "Talonnage", q: "Quelqu'un que je ne connais pas me suit et attend que je lui tienne la porte du bureau. Je…",
      o: ["lui demande poliment son badge ou je l'oriente vers l'accueil", "tiens la porte, ce serait malpoli de refuser", "lui tiens la porte et je lui montre la salle des serveurs"],
      why: "Se faufiler derrière quelqu'un s'appelle le « tailgating ». Un visiteur légitime passe par l'accueil." },
    { tag: "Bons réflexes", q: "Je viens de cliquer sur un lien suspect. En apparence, il ne s'est rien passé. Je…",
      o: ["préviens tout de suite l'équipe sécurité", "ne dis rien, personne n'a rien vu", "crie « JAD, AU SECOURS »"],
      why: "Une alerte rapide limite les dégâts. Personne ne te le reprochera : c'est exactement ce qu'on attend de toi." },
    { tag: "Introduction", q: "Qui est responsable de la cybersécurité dans l'entreprise ?",
      o: ["Tout le monde", "Uniquement l'équipe sécurité", "Le stagiaire, c'est bien connu"],
      why: "L'équipe sécurité met les outils en place, mais un seul clic d'un seul collègue peut les contourner." },
    { tag: "Partage", q: "Un collègue me demande mon mot de passe dans le chat, pour dépanner. Je…",
      o: ["ne le donne pas et je lui propose la bonne procédure d'accès", "le lui envoie, c'est un collègue", "le lui envoie en majuscules pour que ce soit plus sûr"],
      why: "Un mot de passe est personnel. Si un collègue a besoin d'un accès, il existe une procédure pour le lui donner proprement." },
    { tag: "Télétravail", q: "Je travaille depuis un café et mon écran affiche des données clients. Je…",
      o: ["me place dos au mur ou j'ajoute un filtre de confidentialité", "laisse l'écran bien visible pour que tout le monde m'admire", "monte la luminosité au maximum"],
      why: "Un voisin peut lire ton écran sans rien demander. Se placer dos au mur ou poser un filtre de confidentialité limite les regards." },
    { tag: "Antivirus", q: "Mon antivirus ralentit un peu mon ordinateur. Je…",
      o: ["le laisse activé et je patiente", "le désactive pour de bon", "ne l'active que le vendredi"],
      why: "Un PC sans antivirus, c'est une maison sans serrure. Si le ralentissement gêne vraiment, on en parle au support." },
    { tag: "Phishing ciblé", q: "Un inconnu me propose un job de rêve sur LinkedIn et m'envoie un « test technique.zip ». Je…",
      o: ["vérifie qui il est avant d'ouvrir quoi que ce soit", "ouvre le fichier, ça sent le CDI", "l'envoie à mes collègues pour qu'ils l'ouvrent à ma place"],
      why: "Des pirates se font passer pour des recruteurs et cachent des programmes dans leurs fichiers. On vérifie l'identité avant d'ouvrir." },
    { tag: "Phishing", q: "Le phishing, c'est…",
      o: ["un faux message conçu pour piéger", "un sport nautique", "un antivirus très puissant"],
      why: "Le mot vient de « fishing » : le pirate lance l'appât et attend que quelqu'un morde." },
    { tag: "Vocabulaire", q: "Un VPN sert à…",
      o: ["chiffrer ma connexion entre mon ordinateur et le réseau", "télécharger plus vite", "avoir un meilleur signal Wi-Fi"],
      why: "Le VPN crée un tunnel chiffré. Il ne rend pas internet plus rapide, il le rend plus discret." },
    { tag: "Vishing", q: "Un inconnu m'appelle : « Votre ordinateur est infecté, installez ce logiciel de prise en main à distance ». Je…",
      o: ["raccroche", "installe le logiciel, il a l'air gentil", "crie « JAD, AU SECOURS »"],
      why: "Les faux dépanneurs veulent prendre le contrôle de ton PC. Raccroche, et signale l'appel si ça arrive sur ton poste pro." },
    { tag: "Documents", q: "J'ai lancé une impression confidentielle, mais je suis parti sans la récupérer. Je…",
      o: ["retourne la prendre tout de suite", "la laisse, elle finira bien par trouver un lecteur", "crie « JAD, AU SECOURS »"],
      why: "Un document oublié dans le bac peut être lu par n'importe qui qui passe." },
    { tag: "Mots de passe", q: "J'utilise le même mot de passe sur tous mes sites. Si l'un d'eux est piraté…",
      o: ["mes autres comptes sont en danger", "ça ne change rien, les sites ne se parlent pas", "c'est le site piraté qui devra changer mon mot de passe"],
      why: "Les pirates testent les mots de passe volés sur d'autres sites. Un mot de passe différent par compte évite la réaction en chaîne." },
    { tag: "Mots de passe", q: "Mes mots de passe sont trop nombreux pour que je les retienne. Je…",
      o: ["utilise un gestionnaire de mots de passe", "les note sur un post-it sous le clavier", "les colle sur un post-it sur l'écran, c'est plus pratique"],
      why: "Un gestionnaire retient tout à ta place et génère des mots de passe solides. Les post-its sont le premier endroit où on cherche." }
    ,
    { tag: "Scareware", q: "Une fenêtre rouge clignote : « Votre PC est infecté ! Appelez ce numéro tout de suite ». Je…",
      o: ["ferme la fenêtre ou le navigateur et je préviens le support", "appelle le numéro, ils ont l'air inquiets pour moi", "clique sur « Nettoyer maintenant » avant qu'il soit trop tard"],
      why: "Un faux avertissement qui fait peur s'appelle un scareware. Il veut te pousser à payer ou à installer un vrai virus. Ferme-le et préviens le support." },
    { tag: "Ransomware", q: "Mes fichiers sont verrouillés et un message réclame une rançon. Je…",
      o: ["coupe la connexion réseau et j'appelle l'équipe sécurité", "paie vite, c'est moins cher qu'un nouvel ordinateur", "crie « JAD, AU SECOURS »"],
      why: "Couper le réseau empêche le virus de se propager chez tes collègues. Payer ne garantit pas de récupérer les fichiers et encourage les pirates." },
    { tag: "Malware", q: "Un malware, c'est…",
      o: ["un logiciel malveillant conçu pour nuire ou espionner", "un magasin de vêtements en ligne", "une mauvaise connexion Wi-Fi"],
      why: "Virus, ransomware, logiciel espion : tous sont des malwares. Ils arrivent souvent par une pièce jointe, un lien ou un téléchargement douteux." },
    { tag: "Malware", q: "Je veux un jeu payant, et je trouve une version « gratuite » sur un site inconnu. Je…",
      o: ["l'achète ou je le télécharge sur le site officiel", "le télécharge, c'est gratuit donc c'est bon", "désactive l'antivirus pour que ça s'installe mieux"],
      why: "Les versions piratées cachent souvent des logiciels malveillants. Le gratuit se paie parfois avec tes données." },
    { tag: "Brèches de données", q: "J'apprends qu'un site où j'ai un compte a subi une fuite de données. Je…",
      o: ["change mon mot de passe sur ce site et partout où je l'avais réutilisé", "ne fais rien, c'est le problème du site", "attends de voir si on parle de moi dans le journal"],
      why: "Après une fuite, les pirates testent tes identifiants sur d'autres sites. Changer le mot de passe tout de suite coupe court." },
    { tag: "Deepfake", q: "Je reçois un message vocal de mon directeur qui demande un virement urgent. La voix est parfaite. Je…",
      o: ["le rappelle sur son numéro habituel pour confirmer", "fais le virement, c'est bien sa voix", "réponds par un message vocal pour lui demander s'il est sûr"],
      why: "Une voix ou une vidéo peut être imitée par une IA. Une demande d'argent se vérifie toujours par un canal que tu connais déjà." },
    { tag: "Deepfake", q: "Un deepfake, c'est…",
      o: ["un faux contenu vidéo ou audio créé par IA, qui imite quelqu'un", "un poisson des grandes profondeurs", "une sauvegarde très profonde"],
      why: "Le mot mélange « deep learning » et « fake ». Visages et voix peuvent être imités de façon très convaincante." },
    { tag: "Menaces internes", q: "Un collègue me demande de copier des fichiers clients sur sa clé USB perso « pour bosser ce week-end ». Je…",
      o: ["refuse et je signale la demande à l'équipe sécurité", "copie, c'est un collègue de confiance", "copie, mais sur ma propre clé aussi"],
      why: "Une menace interne n'est pas toujours malveillante. Copier des données sur un support perso les sort du cadre protégé : on passe par les outils validés." },
    { tag: "Téléphone personnel", q: "Je veux lire mes mails pro sur mon téléphone perso. Je…",
      o: ["verrouille mon téléphone par code et j'utilise l'appli autorisée", "désactive le code de verrouillage, c'est plus rapide", "prête mon téléphone à mes amis, ils ne regarderont pas"],
      why: "Un téléphone perdu ou volé sans code livre tes mails pro. Verrouillage, mises à jour et appli validée sont le minimum." },
    { tag: "Phishing ciblé", q: "Un mail cite mon prénom, mon poste et mon projet en cours, avec un lien « document à relire ». Je…",
      o: ["vérifie auprès de l'expéditeur par un autre moyen avant de cliquer", "clique, il connaît mon projet donc il est de confiance", "réponds en lui donnant plus d'infos sur mon projet"],
      why: "Le phishing ciblé est personnalisé avec des infos trouvées en ligne. Des détails justes ne prouvent pas que le message est honnête." },
    { tag: "Quishing", q: "Un QR code collé sur une borne de recharge me propose de « payer ici ». Je…",
      o: ["passe par l'appli officielle ou je tape l'adresse moi-même", "le scanne, c'est pratique", "le scanne et je saisis ma carte sans regarder l'adresse"],
      why: "Le quishing cache un lien piégé derrière un QR code, souvent collé par-dessus le vrai. Mieux vaut éviter de scanner à l'aveugle." },
    { tag: "En vacances", q: "Je pars en vacances. Sur les réseaux sociaux, je…",
      o: ["publie mes photos à mon retour", "poste en direct ma maison vide et mon billet d'avion", "mets mon adresse en légende pour recevoir des cartes postales"],
      why: "Annoncer qu'on est absent aide les cambrioleurs et les arnaqueurs. Un billet d'avion en photo montre aussi un code-barres exploitable. Les photos peuvent attendre." },
    { tag: "Vulnérabilités", q: "Une vulnérabilité informatique, c'est…",
      o: ["une faille dans un logiciel qu'un pirate peut exploiter", "un employé un peu fragile", "un mot de passe trop sensible"],
      why: "C'est une faille dans un logiciel ou un système. Les mises à jour servent à la boucher avant que quelqu'un l'exploite." },
    { tag: "Onboarding", q: "Je viens d'arriver dans l'entreprise et on m'a donné un mot de passe temporaire. Je…",
      o: ["le change tout de suite et j'active la double authentification", "garde « Bienvenue2026 » pour toujours", "le colle sur mon écran pour ne pas l'oublier"],
      why: "Un mot de passe temporaire est connu d'au moins une autre personne. Le remplacer et activer la double authentification est le premier réflexe." },
    { tag: "Documents", q: "Je dois partager un document confidentiel avec un partenaire. Je…",
      o: ["utilise l'outil de partage validé, avec un accès limité", "l'envoie depuis ma boîte mail perso, c'est plus simple", "le publie avec un lien ouvert à tous, au cas où"],
      why: "Les outils validés gardent la trace de qui a accès. Un lien ouvert à tous peut atterrir n'importe où." },
    { tag: "Authentification", q: "Mon téléphone affiche 15 demandes d'approbation de connexion que je n'ai pas lancées. Je…",
      o: ["refuse tout, je change mon mot de passe et je préviens la sécurité", "accepte pour que les notifications s'arrêtent", "crie « JAD, AU SECOURS »"],
      why: "Le pirate a probablement ton mot de passe et espère que tu cèdes par lassitude. Refuse tout et fais changer tes accès." },
  ];

  var GOOD = ["Bien joué !", "Exact !", "Réflexe de pro !", "Dans le mille !", "Albert est fier de toi."];
  var BAD = ["Aïe, ça sent le piège.", "Raté, tu perds un orteil.", "Même Albert aurait trouvé.", "Pas cette fois."];
  var LETTERS = ["A", "B", "C"];

  function $(id) { return document.getElementById(id); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmt(t, je) {
    if (!je) return t.charAt(0).toUpperCase() + t.slice(1);
    return (/^[aeiouyàâäéèêëîïôöùûüœh]/i.test(t) ? "J'" : "Je ") + t;
  }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
  function zombie(mood) {
    var n = $("zombieTpl").content.firstElementChild.cloneNode(true);
    n.setAttribute("data-mood", mood);
    return n;
  }

  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var deck = [], last = -1, score = 0, played = 0, cur = null, opts = [], screen = "L", raf = 0;

  function refill() {
    deck = shuffle(Q.map(function (_, i) { return i; }));
    if (deck[deck.length - 1] === last && deck.length > 1) {
      var t = deck[0]; deck[0] = deck[deck.length - 1]; deck[deck.length - 1] = t;
    }
  }

  function updateScore() {
    var s = $("score");
    s.innerHTML = "";
    s.appendChild(document.createTextNode("Score "));
    s.appendChild(el("b", null, score + "/" + played));
  }

  function show(which) {
    screen = which;
    $("screenL").hidden = which !== "L";
    $("screenQ").hidden = which !== "Q";
    $("screenR").hidden = which !== "R";
    window.scrollTo(0, 0);
  }

  function focusOn(node) { try { node.focus({ preventScroll: true }); } catch (e) {} }

  function home() {
    show("L");
    focusOn($("h1"));
  }

  function draw() {
    if (!deck.length) refill();
    var idx = deck.pop();
    last = idx;
    cur = Q[idx];
    var je = /[Jj]e…$/.test(cur.q);
    cur.dq = je ? cur.q.replace(/([Jj])e…$/, "$1e fais quoi ?") : cur.q;
    opts = shuffle(cur.o.map(function (t, i) { return { t: fmt(t, je), ok: i === 0 }; }));

    $("qtag").textContent = cur.tag;
    $("qtext").textContent = cur.dq;
    var box = $("opts");
    box.innerHTML = "";
    opts.forEach(function (o, i) {
      var b = el("button", "opt");
      b.type = "button";
      b.appendChild(el("span", "ltr", LETTERS[i]));
      b.appendChild(el("span", "txt", o.t));
      b.addEventListener("click", function () { choose(i); });
      box.appendChild(b);
    });
    show("Q");
    focusOn($("qtext"));
  }

  function renderResult(i, ok) {
    var r = $("screenR");
    r.innerHTML = "";

    var fig = el("div", "res-fig");
    fig.appendChild(zombie(ok ? "happy" : "dead"));
    r.appendChild(fig);

    var h = el("h2", "headline " + (ok ? "ok" : "ko"), pick(ok ? GOOD : BAD));
    h.tabIndex = -1;
    h.id = "resHead";
    r.appendChild(h);

    if (!ok) r.appendChild(el("p", "snitch", "Albert va remonter ta réponse à Jad."));
    r.appendChild(el("p", "recap", cur.dq));

    var answers = el("div", "answers");
    var mine = el("div", "ans " + (ok ? "right" : "wrong"));
    mine.appendChild(el("small", null, "Ta réponse"));
    mine.appendChild(el("p", null, opts[i].t));
    answers.appendChild(mine);
    if (!ok) {
      var good = opts.filter(function (o) { return o.ok; })[0];
      var right = el("div", "ans right");
      right.appendChild(el("small", null, "Bonne réponse"));
      right.appendChild(el("p", null, good.t));
      answers.appendChild(right);
    }
    r.appendChild(answers);

    var why = el("div", "why");
    why.appendChild(el("h3", null, "À retenir"));
    why.appendChild(el("p", null, cur.why));
    r.appendChild(why);

    var b = el("button", "cta back", "Retour à la crypte");
    b.type = "button";
    b.id = "backBtn";
    b.addEventListener("click", home);
    r.appendChild(b);
  }

  function choose(i) {
    if (screen !== "Q") return;
    var ok = opts[i].ok;
    played++;
    if (ok) score++;
    updateScore();
    renderResult(i, ok);
    show("R");
    focusOn($("backBtn"));
    if (ok) confetti();
  }

  function confetti() {
    if (reduced) return;
    var cv = $("confetti");
    var ctx = cv.getContext("2d");
    if (!ctx) return;
    var d = Math.min(window.devicePixelRatio || 1, 2);
    var W = window.innerWidth, H = window.innerHeight;
    cv.width = W * d;
    cv.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    cv.hidden = false;
    var cols = ["#ff7a1a", "#ffb35a", "#9b5cff", "#a6f26b", "#f6efe6", "#ffd23f"];
    var ps = [];
    for (var i = 0; i < 170; i++) {
      var left = i % 2 === 0;
      var ang = (left ? -68 : -112) * Math.PI / 180 + (Math.random() - 0.5) * 0.8;
      var sp = 12 + Math.random() * 12;
      ps.push({
        x: left ? W * 0.06 : W * 0.94, y: H * 0.96,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        w: 6 + Math.random() * 7, h: 4 + Math.random() * 5,
        r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35,
        c: cols[i % cols.length]
      });
    }
    var start = performance.now();
    cancelAnimationFrame(raf);
    function frame(now) {
      ctx.clearRect(0, 0, W, H);
      var alive = 0;
      for (var k = 0; k < ps.length; k++) {
        var p = ps[k];
        p.vy += 0.34; p.vx *= 0.99; p.vy *= 0.992;
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if (p.y < H + 24) {
          alive++;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.r);
          ctx.scale(1, Math.cos(p.r * 2.3));
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
      }
      if (alive && now - start < 5500) raf = requestAnimationFrame(frame);
      else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
    }
    raf = requestAnimationFrame(frame);
  }

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || screen !== "Q") return;
    var m = { a: 0, b: 1, c: 2, "1": 0, "2": 1, "3": 2 };
    var k = String(e.key).toLowerCase();
    if (Object.prototype.hasOwnProperty.call(m, k)) choose(m[k]);
  });

  $("figL").appendChild(zombie("idle"));
  $("count").textContent = Q.length + " questions cachées dans la crypte d'Albert";
  $("draw").addEventListener("click", draw);
  updateScore();
})();
</script>
